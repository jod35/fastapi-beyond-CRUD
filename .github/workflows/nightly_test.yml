name: Nightly Build and Push

on:
  schedule:
    - cron: "0 0 * * *" # Runs at 12:00 AM UTC (nightly)
  workflow_dispatch: # Allows manual execution

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Start Services (Docker Compose)
        run: docker compose up -d

      - name: Wait for Database to be Ready
        run: |
          echo "Waiting for PostgreSQL to start..."
          sleep 10
      - name: Run Alembic Migrations
        run: docker compose exec -T web alembic upgrade head

      - name: Run Tests with Pytest
        run: docker compose exec -T web pytest --disable-warnings
        continue-on-error: false

      - name: Stop Docker Compose
        if: always()
        run: docker compose down

      - name: Build and Push Docker Image (if tests pass)
        if: success()
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/fastapi-app:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/fastapi-app:latest
      - name: Send Failure Notification (if tests fail)
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.ethereal.email
          server_port: 587
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: "no-reply@bookly.com"
          to: ${{ secrets.MAIL_ROOT }}
          subject: "❌ Nightly Build Failed"
          body: "The nightly build for the repository ${{ github.repository }} has failed. Please check the logs for more details."
